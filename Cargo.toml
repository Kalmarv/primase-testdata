[package]
name = "primase-testdata"
description = "Real-data inputs for tests: each consumer declares the game files, tools and oracle outputs its tests read; one machine-wide TOML file (GAME_DATA) says where they are, and what is not configured skips; gate reports for comparing against an oracle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
toml.workspace = true
thiserror.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[workspace]


[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/Kalmarv/primase-testdata"
publish = false

[workspace.dependencies]
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order", "float_roundtrip"] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
float_cmp = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
iter_over_hash_type = "deny"
disallowed_methods = "allow"
disallowed_types = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.test]
opt-level = 1
